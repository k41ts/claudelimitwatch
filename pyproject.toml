[project]
name = "climitwatch"
version = "0.1.0"
description = "Always-on-top Windows monitor for remaining Claude usage limits"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.gui-scripts]
climitwatch = "climitwatch.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
